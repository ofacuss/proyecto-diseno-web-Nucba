<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - El Tano</title>
    <!-- Vincula tu CSS principal -->
    <link rel="stylesheet" href="Estilos.css">
    <style>
        /* Estilos específicos traducidos */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #e8f5e9 0%, #ffffff 100%);
            flex-direction: column;
        }

        .contenedor-registro {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 400px;
        }

        .logotipo-registro {
            margin-bottom: 20px;
            border-radius: 50%; 
        }

        form {
            display: flex;
            flex-direction: column;
            text-align: left;
        }

        label {
            margin-bottom: 5px;
            font-weight: 600;
            color: #333;
        }

        input {
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
            outline: none;
        }

        input:focus {
            border-color: #4CAF50;
        }

        button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 15px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #388E3C;
        }

        .enlace-volver {
            margin-top: 15px;
            display: block;
            text-align: center;
            color: #666;
            text-decoration: none;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="contenedor-registro">
        <a href="index.html">
            <img src="assets/logo.jpg" width="80" height="80" alt="Logo" class="logotipo-registro">
        </a>
        
        <h2>Crea tu cuenta</h2>
        <p style="color: #666; margin-bottom: 20px;">Únete a la huerta orgánica más grande.</p>

        <form action="#">
            <label for="nombre-completo">Nombre completo</label>
            <input type="text" id="nombre-completo" name="nombre_completo" placeholder="Tu nombre" required>

            <label for="correo">E-mail</label>
            <input type="email" id="correo" name="correo" placeholder="ejemplo@correo.com" required>

            <label for="clave">Contraseña</label>
            <input type="password" id="clave" name="clave" placeholder="Mínimo 8 caracteres" required>

            <button type="submit">Registrarse</button>
        </form>

        <a href="index.html" class="enlace-volver">← Volver al inicio</a>
    </div>

</body>
</html>
